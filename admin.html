<!doctype html>
<html lang="fr">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="doc.titre">Atelier Typo Cao</title>
<link rel="stylesheet" href="ui.css">
<script src="ui.js"></script>
<script src="i18n-atelier.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#ece5d8; --surface:#faf6ee; --fg:#2b2218; --muted:#8d7d67;
  --gold:#a87c3f; --gold-deep:#8a6330; --line:#ddd2bd; --ok:#3d7a46; --err:#a33b2e;
  --ombre:0 24px 60px -24px rgba(90,62,28,.35);
  --display:"Fraunces",Georgia,serif; --body:"Outfit",system-ui,sans-serif;
}
html{font-size:19px}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 700px at 50% -200px,#f7f1e4,var(--bg) 72%);color:var(--fg);font-family:var(--body);font-weight:300;line-height:1.65;padding-inline:16px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding-block:40px 90px}
h1{font-family:var(--display);font-weight:300;letter-spacing:.14em;font-size:clamp(2.2rem,6vw,3rem);margin:0}
h1 b{color:var(--gold-deep);font-weight:600}
h2{font-family:var(--display);font-weight:500;font-size:1.55rem;margin:0 0 6px;letter-spacing:.01em}
h2::after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin-top:10px;border-radius:2px}
.sub{color:var(--muted);font-size:.82rem;letter-spacing:.34em;text-transform:uppercase;margin-top:10px}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:34px 34px 38px;margin-top:28px;box-shadow:0 1px 0 #fffdf8 inset}
@media (max-width:640px){section{padding:24px 20px 28px}}
/* ---- journal des visites & connexions ---- */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.chip{background:#faf6ec;border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:.95rem}
.chip b{font-weight:600;color:var(--gold-deep)}
.chip.alerte{background:#fdf0ee;border-color:#e8c4bc;color:#8c3b2e}
.chip.alerte b{color:#a63d2a}
.graph{display:flex;align-items:flex-end;gap:5px;height:110px;margin:18px 2px 4px;border-bottom:1px solid var(--line);padding-bottom:0}
.graph .barre{flex:1;min-width:8px;background:linear-gradient(180deg,#d9b25e,#c09540);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.graph .barre.vide{background:#eee5d2}
.graph .barre span{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:.78rem;color:#8a7f6a;white-space:nowrap}
.graph-legende{display:flex;gap:5px;margin-bottom:10px}
.graph-legende i{flex:1;min-width:8px;font-style:normal;font-size:.74rem;color:#a89a7f;text-align:center}
.conn-liste{margin-top:8px;border-top:1px solid var(--line)}
.conn{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line);font-size:.95rem}
.conn .quand{color:#8a7f6a;font-variant-numeric:tabular-nums;min-width:138px}
.conn .quoi{font-weight:500}
.conn .detail{color:#8a7f6a}
.conn.ok .quoi{color:#4a6b3a}
.conn.alerte{background:#fdf0ee;border-radius:6px}
.conn.alerte .quoi{color:#a63d2a}
.hint{color:var(--fg);opacity:.78;font-size:1rem;margin:10px 0 20px;max-width:56ch}



/* boutons et champs : voir ui.css — ici, seulement ce qui est propre à l'atelier */







/* ---- écran de connexion : l'entrée de l'atelier ---- */
.porte{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lettres{display:flex;align-items:flex-end;justify-content:center;gap:.3rem;margin:34px 0 10px;flex-wrap:wrap}
.lettres img{height:clamp(44px,9vw,76px);width:auto;filter:drop-shadow(0 14px 18px rgba(90,62,28,.35))}
@media (prefers-reduced-motion:no-preference){
  .lettres img{animation:entree .6s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:calc(var(--i)*90ms)}
  @keyframes entree{from{opacity:0;transform:translateY(22px) scale(.82)}to{opacity:1;transform:none}}
}
.porte-carte{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px 40px 44px;margin-top:26px;box-shadow:var(--ombre);text-align:left}
@media (max-width:640px){.porte-carte{padding:28px 22px 32px}}
.porte-carte h2{font-size:1.7rem}
.porte-carte input{min-height:var(--ctl-h-lg);font-size:1.2rem;letter-spacing:.04em;text-align:center}
.porte-carte button{width:100%;min-height:var(--ctl-h-lg);font-size:1rem;margin-top:8px}
.bienvenue{font-family:var(--display);font-weight:300;font-size:1.15rem;color:var(--muted);margin:14px 0 0;font-style:italic}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tarif-row{display:grid;grid-template-columns:1.2fr 110px 100px 100px 1.4fr auto;gap:10px;margin-bottom:10px;align-items:center}
.tarif-row .t-montant,.tarif-row .t-yuan{text-align:right}
.qr-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.qr-case{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fffdf8;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.qr-case b{font-weight:500;font-size:.92rem}
.qr-case .cadre{width:100%;aspect-ratio:1;border-radius:6px;background:#f3ece0;display:grid;place-items:center;overflow:hidden}
.qr-case .cadre img{width:100%;height:100%;object-fit:contain}
.qr-case .cadre span{color:var(--muted);font-size:.84rem}
.qr-case .row{justify-content:center}
.qr-case input[type=file]{font-size:.82rem}
@media (max-width:640px){.tarif-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto}}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.mat{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fffdf8;display:flex;flex-direction:column;gap:6px}
.mat img{height:76px;object-fit:contain}
.mat input{min-height:var(--ctl-h-sm);font-size:.88rem;padding:.4em .6em}
.coll-row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:#fffdf8}
.coll-row img{height:44px}
.avis-admin{display:flex;flex-direction:column;gap:10px}
.avis-card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#fffdf8}
.avis-card.publie{border-color:var(--ok)}
.avis-card .tete{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.avis-card .nom{font-weight:500}
.avis-card .note{color:var(--gold-deep);letter-spacing:2px}
.avis-card .quand{color:var(--muted);font-size:.82rem}
.avis-card .etat{margin-left:auto;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.avis-card.publie .etat{color:var(--ok)}
.avis-card .texte{margin:6px 0 10px;font-size:.88rem}
.media-liste{display:flex;flex-direction:column;gap:10px}
.media-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fffdf8}
.media-card .vignette{width:96px;height:72px;object-fit:cover;border-radius:4px;background:#2b2218;box-shadow:0 6px 14px -6px rgba(90,62,28,.5)}
.media-card .titre{font-weight:500}
.media-card .det{color:var(--muted);font-size:.86rem}
.media-card .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.media-card .liens{grid-column:1/-1;font-size:.86rem;display:flex;flex-direction:column;gap:6px}
.media-card .liens div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.media-card .liens code{background:#f3ece0;padding:4px 8px;border-radius:4px;font-size:.84rem;user-select:all}
.media-card .liens .vieux{opacity:.55;text-decoration:line-through}
.media-form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.media-form .large{grid-column:1/-1}
.media-form label.f{margin-top:12px}
@media (max-width:760px){.media-form{grid-template-columns:1fr}.media-card{grid-template-columns:auto 1fr}.media-card .actions{grid-column:1/-1;justify-content:flex-start}}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:#fdf9f1;border-radius:6px;padding:10px 20px;font-size:.85rem;max-width:90vw;z-index:9}
.status.err{background:var(--err)}
.status.ok{background:var(--ok)}
.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 20px;margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.savebar .note{color:var(--muted);font-size:.88rem}
.topbar{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:1.7rem}
.topbar .right{margin-left:auto}
.langues{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.langues button{min-height:var(--ctl-h-sm);padding:0 .9em;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:.8rem}
.langues button:hover{background:rgba(168,124,63,.1);color:var(--gold-deep);border-color:transparent}
.langues button.on{background:var(--gold-deep);color:#fdf9f1}
/* nouveautés */
.nouveautes{margin-top:18px;padding:22px 26px;border-radius:12px;background:#fffdf8;border:1px solid var(--gold);box-shadow:0 10px 30px -18px rgba(90,62,28,.5)}
.nv-tete{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nv-tete b{font-weight:500;font-size:1.15rem}
.nv-pastille{background:var(--gold-deep);color:#fdf9f1;border-radius:999px;padding:3px 11px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;flex:none}
.nv-date{color:var(--muted);font-size:.86rem;margin-left:auto}
.nouveautes ul{margin:14px 0 16px;padding-left:1.1em;line-height:1.75}
.nouveautes li{margin-bottom:6px}
.nv-lien{margin:14px 0 0;text-align:right}
.nv-lien a{color:var(--muted);font-size:.88rem}
.nv-lien a:hover{color:var(--gold-deep)}
.modal-nv{position:fixed;inset:0;background:rgba(43,34,24,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;box-sizing:border-box}
.nv-panneau{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;padding:28px 32px;box-sizing:border-box;box-shadow:0 30px 70px rgba(90,62,28,.35)}
.nv-panneau-tete{display:flex;align-items:center;gap:16px}
.nv-panneau-tete h2{margin:0;flex:1}
.nv-entree{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.nv-entree:first-of-type{border-top:0}
.nv-entree .nv-tete b{font-size:1.02rem}
.nv-entree ul{margin:10px 0 0;padding-left:1.1em;line-height:1.7;color:var(--fg)}
html[lang="zh-Hans"] .nv-pastille{letter-spacing:.04em}
@media (max-width:640px){.nouveautes{padding:18px 18px}.nv-panneau{padding:22px 18px}.nv-date{margin-left:0;width:100%}}
html[lang="zh-Hans"] label.f{letter-spacing:.02em;text-transform:none;font-size:.85rem}
html[lang="zh-Hans"] button,html[lang="zh-Hans"] .onglets button{letter-spacing:.02em}
html[lang="zh-Hans"] .sub{letter-spacing:.08em}
.progress{font-size:.9rem;color:var(--gold-deep)}
/* ---- tableau de bord à onglets, écran fixe ---- */
body.dash{height:100vh;overflow:hidden}
body.dash .wrap{height:100vh;padding-block:18px 0;display:flex;flex-direction:column;box-sizing:border-box}
#dashView{display:flex;flex-direction:column;flex:1;min-height:0}
.onglets{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.onglets::-webkit-scrollbar{display:none}
.onglets button{appearance:none;min-height:3rem;padding:0 1em;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:inherit;font-size:.92rem;font-weight:400;color:var(--muted);white-space:nowrap;letter-spacing:.01em;border-radius:0}
.onglets button:hover{color:var(--fg);background:none;transform:none;box-shadow:none}
.onglets button.actif{color:var(--gold-deep);font-weight:500;border-bottom-color:var(--gold)}
.onglets button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:#efe6d3;color:var(--gold-deep);font-size:.7rem;font-weight:600;line-height:18px;text-align:center;vertical-align:1px}
.pages{flex:1;min-height:0;overflow-y:auto;padding-bottom:24px;scroll-behavior:smooth}
.pages section:first-child{margin-top:22px}
.page[hidden]{display:none}
.accueil-mot{margin-top:22px;padding:28px 34px;border-radius:14px;background:linear-gradient(135deg,#fbf7ef,#f3eadb);border:1px solid var(--line);display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.accueil-mot .lettre{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(70,48,22,.25));flex-shrink:0}
.accueil-mot h2{font-size:1.75rem;margin:0}
.accueil-mot h2::after{display:none}
.accueil-mot p{margin:6px 0 0;color:var(--muted);font-size:.95rem;max-width:56ch}
.savebar{z-index:2}
body.dash .wrap{max-width:1480px}
.j-cols{display:grid;grid-template-columns:1fr;gap:28px 48px;margin-top:6px}
.j-droite .hint{margin-bottom:8px}
@media (min-width:1100px){
  .j-cols{grid-template-columns:1.05fr .95fr}
  .j-droite{border-left:1px solid var(--line);padding-left:40px}
  body.dash section{padding:38px 44px 42px}
  body.dash .mat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  body.dash .hint{max-width:72ch}
}
@media (max-width:640px){.accueil-mot{padding:22px 20px}.onglets button{padding:10px 12px;font-size:.86rem}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- connexion : l'entrée de l'atelier -->
  <div id="loginView" class="porte">
    <h1>TYPO <b>CAO</b></h1>
    <div class="sub" data-i18n="porte.sous">L'atelier de Yuan</div>
    <div class="lettres" aria-hidden="true">
      <img src="assets/mix_A.webp" alt="" style="--i:0">
      <img src="assets/mix_T.webp" alt="" style="--i:1">
      <img src="assets/mix_E.webp" alt="" style="--i:2">
      <img src="assets/mix_L.webp" alt="" style="--i:3">
      <img src="assets/mix_I.webp" alt="" style="--i:4">
      <img src="assets/mix_E2.webp" alt="" style="--i:5">
      <img src="assets/mix_R.webp" alt="" style="--i:6">
    </div>
    <div class="porte-carte">
      <h2 id="salut" data-i18n="porte.bienvenue">Bienvenue</h2>
      <div id="authFields" hidden>
        <p class="hint" data-i18n="porte.numeroAide"></p>
        <label class="f" for="numtel" data-i18n="porte.numero">Ton numéro WhatsApp</label>
        <input type="tel" id="numtel" autocomplete="tel" data-i18n-ph="porte.telPh" placeholder="06 12 34 56 78">
      </div>
      <div id="codeFields" hidden>
        <p class="hint" data-i18n="porte.codeAide"></p>
        <label class="f" for="otp" data-i18n="porte.code">Code reçu sur WhatsApp</label>
        <input type="text" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
        <p class="hint" id="codeAide" hidden style="margin-top:14px"><span data-i18n="porte.aide1"></span> <b>+33 7 58 88 29 33</b><span data-i18n="porte.aide2"></span> <a href="#" id="renvoyerCode" data-i18n="porte.aideLien"></a><span data-i18n="porte.aide3"></span></p>
      </div>
      <div id="tokenFields" hidden>
        <p class="hint" data-i18n="porte.cleAide"></p>
        <label class="f" for="tok" data-i18n="porte.cle">Clé d'accès</label>
        <input type="password" id="tok" autocomplete="current-password" placeholder="github_pat_…">
      </div>
      <div style="margin-top:20px">
        <button id="loginBtn" data-i18n="porte.connecter">Se connecter</button>
        <div class="progress" id="loginMsg" style="text-align:center;margin-top:10px"></div>
      </div>
    </div>
    <p class="bienvenue" data-i18n="porte.mot"></p>
  </div>

  <!-- tableau de bord -->
  <div id="dashView" hidden>
    <div class="topbar">
      <h1>TYPO <b>CAO</b></h1>
      <div class="sub" data-i18n="dash.titre">Atelier de Yuan</div>
      <div class="right row">
        <div class="langues" id="langues" role="group" aria-label="Langue · 语言"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="zh">中文</button></div>
        <a class="ghost" href="./" style="color:var(--gold-deep);font-size:.8rem" data-i18n="dash.voirSite">Voir le site →</a>
        <button class="ghost small" id="logoutBtn" data-i18n="dash.deconnexion">Se déconnecter</button>
      </div>
    </div>

    <nav class="onglets" data-i18n-aria="ong.aria" aria-label="Pages de l'atelier">
      <button type="button" data-page="accueil" class="actif"><span data-i18n="ong.accueil">Accueil</span><span class="n" id="nAccueil" hidden></span></button>
      <button type="button" data-page="boutique" data-i18n="ong.boutique">Contacts &amp; tarifs</button>
      <button type="button" data-page="collections"><span data-i18n="ong.collections">Collections</span><span class="n" id="nColl"></span></button>
      <button type="button" data-page="matieres"><span data-i18n="ong.matieres">Matières</span><span class="n" id="nMat"></span></button>
      <button type="button" data-page="revues"><span data-i18n="ong.revues">Revues</span><span class="n" id="nRevues"></span></button>
      <button type="button" data-page="videos"><span data-i18n="ong.videos">Vidéos</span><span class="n" id="nVideos"></span></button>
      <button type="button" data-page="avis"><span data-i18n="ong.avis">Avis clients</span><span class="n" id="nAvis" hidden></span></button>
    </nav>

    <div class="pages">
    <div class="page" data-page="accueil">
    <div class="accueil-mot">
      <img class="lettre" src="assets/perles_Y.webp" alt="">
      <div>
        <h2 id="accueilSalut"></h2>
        <p data-i18n="acc.mot"></p>
      </div>
    </div>

    <section class="nouveautes" id="nouveautesCarte" hidden>
      <div class="nv-tete">
        <span class="nv-pastille" data-i18n="nv.nouveau"></span>
        <b id="nvTitre"></b>
        <span class="nv-date" id="nvDate"></span>
      </div>
      <ul id="nvPoints"></ul>
      <div class="row" style="margin-top:4px">
        <button class="small" id="nvVu" data-i18n="nv.vu"></button>
        <button class="ghost small" id="nvHisto" data-i18n="nv.histo"></button>
      </div>
    </section>

    <p class="nv-lien" id="nvLienBas"><a href="#" id="nvHisto2" data-i18n="nv.histo"></a></p>

    <section id="journalSection" hidden>
      <h2 data-i18n="jr.titre"></h2>
      <p class="hint" data-i18n="jr.sous"></p>
      <div class="j-cols">
        <div class="j-gauche">
          <b style="font-weight:500;display:block" data-i18n="jr.vitrine"></b>
          <div class="chips" id="journalChips"></div>
          <div id="journalGraphBox" hidden>
            <div class="graph" id="journalGraph"></div>
            <div class="graph-legende" id="journalGraphLegende"></div>
          </div>
        </div>
        <div class="j-droite">
          <b style="font-weight:500;display:block" data-i18n="jr.porte"></b>
          <p class="hint" style="margin-top:4px" data-i18n="jr.porteSous"></p>
          <div class="conn-liste" id="journalConnexions"></div>
          <p class="hint" id="journalNote" style="margin-top:12px"></p>
        </div>
      </div>
    </section>
    </div>

    <div class="page" data-page="boutique" hidden>
    <section>
      <h2 data-i18n="ct.titre"></h2>
      <label class="f" data-i18n="ct.whatsapp"></label>
      <input type="text" id="fWhatsapp" placeholder="33612345678">
      <label class="f" data-i18n="ct.instagram"></label>
      <input type="text" id="fInstagram" placeholder="mon.pseudo">
      <label class="f" data-i18n="ct.paypal"></label>
      <input type="text" id="fPaypal" placeholder="ex. YuanCao — ton lien est paypal.me/YuanCao">
      <label class="f" data-i18n="ct.wechat"></label>
      <input type="text" id="fWechat" placeholder="ex. yuan_cao_88">
      <p class="hint" style="margin-top:8px" data-i18n-html="ct.wechatAide"></p>
      <label class="f" data-i18n="ct.qr"></label>

const REPO = "Nraboudi-beep/typo-cao";
const BRANCHES = ["typo-cao", "main"];
const API = "https://api.github.com";
const ATELIER_API = "https://typo.atelierdedemain.fr/api/typo-cao";
let MODE = null;      // "serveur" (identifiant + code WhatsApp) ou "cle" (clé GitHub directe)

let SESSION = null;   // jeton de session (mode "serveur")

/* ---------- API de l'atelier (le jeton GitHub reste sur le serveur) ---------- */
async function apiAtelier(path, options = {}){
  const r = await fetch(ATELIER_API + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(SESSION ? { "Authorization": "Bearer " + SESSION } : {}),
      ...(options.headers || {})
    }
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok){
    const err = new Error((data.error && data.error.message) || data.message || t("err.serveur", { s: r.status }));
    err.code = (data.error && data.error.code) || data.code || "";
    throw err;
  }
  return data;
}

/* ---------- API GitHub directe (mode clé, secours) ---------- */
function hdr(){ return { "Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json" }; }

async function ghGetFile(path, branch){
  const r = await fetch(`${API}/repos/${REPO}/contents/${path}?ref=${branch}`, { headers: hdr() });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(t("err.lecture", { s: r.status }));
  return r.json();
}

/* ---------- lecture / écriture, selon le mode ---------- */
async function readConfig(){
  if (MODE === "serveur"){
    const f = await apiAtelier("/file?path=config.json");
    return JSON.parse(decodeURIComponent(escape(atob(f.contentB64))));
  }
  const f = await ghGetFile("config.json", BRANCHES[0]);
  if (!f) throw new Error(t("err.config"));
  return JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g, "")))));
}

async function putFile(path, base64, message){
  if (MODE === "serveur"){
    await apiAtelier("/file", { method: "PUT", body: JSON.stringify({ path, contentB64: base64, message }) });
    return;
  }
  for (const branch of BRANCHES){
    const existing = await ghGetFile(path, branch);
    const body = { message, content: base64, branch };
    if (existing && existing.sha) body.sha = existing.sha;
    const r = await fetch(`${API}/repos/${REPO}/contents/${path}`, {
      method: "PUT", headers: { ...hdr(), "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!r.ok){
      const e = await r.json().catch(() => ({}));
      throw new Error(t("err.enregistrement", { s: r.status }) + " " + (e.message || ""));
    }
  }
}

function toB64(str){
  return btoa(String.fromCharCode(...new TextEncoder().encode(str)));
}
async function blobToB64(blob){
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = "";
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}

/* ---------- traitement d'image : recadrage, 300px, filigrane ---------- */
async function traiterImage(file, maxH = 300){
  const bmp = await createImageBitmap(file);
  let c = document.createElement("canvas");
  c.width = bmp.width; c.height = bmp.height;
  let ctx = c.getContext("2d");
  ctx.drawImage(bmp, 0, 0);
  // recadrage sur les pixels non transparents
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let y = 0; y < c.height; y++)
    for (let x = 0; x < c.width; x++)
      if (d[(y * c.width + x) * 4 + 3] > 20){
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
  if (maxX <= minX){ minX = 0; minY = 0; maxX = c.width - 1; maxY = c.height - 1; }
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const nh = Math.min(maxH, h), nw = Math.round(w * nh / h);
  const out = document.createElement("canvas");
  out.width = nw; out.height = nh;
  const octx = out.getContext("2d");
  octx.drawImage(c, minX, minY, w, h, 0, 0, nw, nh);
  // filigrane uniquement sur la lettre (source-atop suit la forme)
  octx.globalCompositeOperation = "source-atop";
  octx.save();
  octx.translate(nw / 2, nh / 2);
  octx.rotate(-30 * Math.PI / 180);
  octx.font = "bold 26px system-ui, sans-serif";
  const stepX = 180, stepY = 86;
  let row = 0;
  for (let y = -nh; y < nh; y += stepY, row++){
    const off = (row % 2) * (stepX / 2);
    for (let x = -nw - stepX; x < nw + stepX; x += stepX){
      octx.fillStyle = "rgba(0,0,0,0.42)";
      octx.fillText("TYPO CAO", x + off + 2, y + 2);
      octx.fillStyle = "rgba(255,255,255,0.5)";
      octx.fillText("TYPO CAO", x + off, y);
    }
  }
  octx.restore();
  return new Promise(res => out.toBlob(res, "image/webp", 0.82));
}

  const refus = (j.connexions || []).filter(c => c.type === "numero_inconnu" || c.type === "code_errone" || c.type === "trop_essais").length;

/* ================== MÉDIATHÈQUE : revues (PDF payants) et vidéos d'exemple ================== */
const MEDIA_URL = ATELIER_API.replace(/\/api\/typo-cao$/, "");
let REVUES = [], VIDEOS = [], LIENS = [];
const echap = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ko = n => n > 1e6 ? (n / 1e6).toFixed(1) + " Mo" : Math.round(n / 1024) + " Ko";
const quand = iso => { try { return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } };

/* envoi binaire avec progression (XHR) */
function envoyerBinaire(path, blob, type, onProgress){
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", ATELIER_API + path);
    x.setRequestHeader("Content-Type", type);
    if (SESSION) x.setRequestHeader("Authorization", "Bearer " + SESSION);
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch {} if (x.status >= 200 && x.status < 300) resolve(j); else reject(new Error((j.error && j.error.message) || ("Erreur " + x.status))); };
    x.onerror = () => reject(new Error(t("err.reseau")));
    x.send(blob);
  });
}
const versJpeg = (canvas, q = 0.82) => new Promise(r => canvas.toBlob(r, "image/jpeg", q));

/* filigrane diagonal sur une image d'aperçu */
function filigraner(ctx, w, h, texte = "TYPO CAO · APERÇU"){
  ctx.save(); ctx.translate(w / 2, h / 2); ctx.rotate(-28 * Math.PI / 180);
  ctx.font = "bold " + Math.round(w / 11) + "px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const pas = Math.round(w / 4.2);
  for (let y = -h; y < h; y += pas) for (let x = -w; x < w; x += w * 0.9){ ctx.fillStyle = "rgba(43,34,24,.16)"; ctx.fillText(texte, x + (Math.round(y / pas) % 2) * w * 0.45, y); ctx.fillStyle = "rgba(255,253,248,.22)"; ctx.fillText(texte, x + (Math.round(y / pas) % 2) * w * 0.45 + 2, y + 2); }
  ctx.restore();
}

/* pdf.js (chargé à la demande) : rendu des pages d'aperçu */
let pdfjsPromesse = null;
function chargerPdfjs(){
  if (pdfjsPromesse) return pdfjsPromesse;
  pdfjsPromesse = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; resolve(window.pdfjsLib); } catch (e) { reject(e); } };
    s.onerror = () => reject(new Error(t("err.pdfjs")));
    document.head.appendChild(s);
  });
  return pdfjsPromesse;
}
async function apercusPdf(file, nb = 4){
  const pdfjs = await chargerPdfjs();
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const images = [];
  for (let n = 1; n <= Math.min(nb, doc.numPages); n++){
    const page = await doc.getPage(n);
    const v0 = page.getViewport({ scale: 1 });
    const scale = Math.min(1100 / v0.width, 1400 / v0.height, 3);
    const vp = page.getViewport({ scale });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d");
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    if (n > 1) filigraner(ctx, c.width, c.height);      // la couverture reste propre, les pages sont filigranées
    images.push(await versJpeg(c, n === 1 ? 0.86 : 0.78));
  }
  return { images, pages: doc.numPages };
}

/* ---- codes QR (contact WeChat, WeChat Pay, Alipay) ---- */
const QR_TYPES_ATELIER = ["wechat", "wechatpay", "alipay"];
let QR_PRESENTS = [];
function construireQr(){
  const g = $("qrGrille"); g.innerHTML = "";
  for (const type of QR_TYPES_ATELIER){
    const titre = t("qr." + type), sous = t("qr." + type + "Sous");
    const present = QR_PRESENTS.includes(type);
    const c = document.createElement("div"); c.className = "qr-case";
    c.innerHTML = `<b>${titre}</b><div class="cadre">${present ? `<img alt="" src="${MEDIA_URL}/q/${type}.png?${Date.now()}">` : `<span>${t("qr.aucun")}</span>`}</div>
      <div class="det" style="color:var(--muted);font-size:.82rem">${sous}</div>
      <input type="file" accept="image/png,image/jpeg,image/webp">
      <div class="row"><span class="progress"></span>${present ? `<button class="small danger" type="button">${t("qr.retirer")}</button>` : ""}</div>`;
    c.querySelector("input").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const msg = c.querySelector(".progress"); msg.textContent = "Envoi…";
      try { await envoyerBinaire("/qr/" + type, await qrEnPng(f), "image/png"); msg.textContent = ""; statusMsg(t("qr.enregistre"), "ok"); await chargerQr(); }
      catch (err) { msg.textContent = ""; statusMsg(err.message, "err"); }
    };
    const sup = c.querySelector("button");
    if (sup) sup.onclick = async () => { if (!confirm(t("qr.retirerConf"))) return; try { await apiAtelier("/qr/" + type, { method: "DELETE" }); await chargerQr(); statusMsg(t("qr.retire"), "ok"); } catch (e) { statusMsg(e.message, "err"); } };
    g.appendChild(c);
  }
}
/* le QR est réenregistré en PNG (sans perte) et réduit à 720 px : lisible par les scanners */
async function qrEnPng(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 720 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/png"));
}
async function chargerQr(){
  try { const r = await fetch(ATELIER_API + "/qr", { cache: "no-store" }); if (r.ok) QR_PRESENTS = (await r.json()).types || []; } catch {}
  construireQr();
}

/* image de couverture d'une vidéo : une image prise à 1 s */
function posterVideo(file){
  return new Promise(resolve => {
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = URL.createObjectURL(file);
    const fini = async () => { try { const c = document.createElement("canvas"); const k = Math.min(1, 960 / v.videoWidth); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k); c.getContext("2d").drawImage(v, 0, 0, c.width, c.height); resolve(await versJpeg(c, 0.82)); } catch { resolve(null); } URL.revokeObjectURL(v.src); };
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 2); };
    v.onseeked = fini; v.onerror = () => resolve(null);
    setTimeout(() => resolve(null), 8000);
  });
}

      msg.textContent = t("vd.poster");
      const poster = await posterVideo(file);
      await envoyerBinaire("/video/" + id + "/fichier", file, file.type, p => { msg.textContent = t("vd.envoiVideo", { p: Math.round(p * 100) }); });
      if (poster) await envoyerBinaire("/video/" + id + "/poster", poster, "image/jpeg");
    }
    msg.textContent = ""; statusMsg(t("vd.enLigne"), "ok");
    $("vidTitre").value = ""; $("vidDesc").value = ""; $("vidLien").value = ""; $("vidFichier").value = "";
    await chargerMedia();
  } catch (e) { msg.textContent = ""; statusMsg(e.message, "err"); }
  btn.disabled = false;
};

let etape = "identifiants"; // puis "code" (mode serveur)
let aideTimer = null;

function demanderCode(){
  return apiAtelier("/login", { method: "POST", body: JSON.stringify({ numero: $("numtel").value }) });
}

function montrerAideCode(){
  $("codeAide").hidden = true;
  clearTimeout(aideTimer);
  aideTimer = setTimeout(() => { if (etape === "code") $("codeAide").hidden = false; }, 30000);
}

$("renvoyerCode").onclick = async (ev) => {
  ev.preventDefault();
  $("loginMsg").textContent = t("porte.renvoi");
  try {
    await demanderCode();
    $("loginMsg").textContent = "";
    statusMsg(t("porte.renvoye"));
    montrerAideCode();
  } catch (e) {
    $("loginMsg").textContent = "";
    statusMsg(e.message || t("porte.renvoiKo"), "err");
  }
};

$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true;
  try {
    if (MODE === "serveur"){
      if (etape === "identifiants"){
        $("loginMsg").textContent = t("porte.envoiCode");
        await demanderCode();
        etape = "code";
        $("authFields").hidden = true; $("codeFields").hidden = false;
        $("loginBtn").textContent = t("porte.valider");
        $("loginMsg").textContent = "";
        $("otp").focus();
        montrerAideCode();
      } else {
        $("loginMsg").textContent = "Validation…";
        const s = await apiAtelier("/verify", { method: "POST", body: JSON.stringify({
          numero: $("numtel").value, code: $("otp").value.trim()
        })});
        SESSION = s.jeton;
        try {
          localStorage.setItem("tc_session", s.jeton);
          localStorage.setItem("tc_session_exp", s.expireLe);
        } catch {}
        $("loginMsg").textContent = "";
        await ouvrirDash();
      }
    } else {
      TOKEN = $("tok").value.trim();
      $("loginMsg").textContent = "Vérification…";
      await ouvrirDash();
      try { localStorage.setItem("tc_token", TOKEN); } catch {}
      $("loginMsg").textContent = "";
    }
  } catch (e) {
    $("loginMsg").textContent = "";
    statusMsg(e.message || t("porte.connexionKo"), "err");
    if (MODE === "serveur" && etape === "code" &&
        (e.code === "TYPO_CAO_CODE_EXPIRED" || e.code === "TYPO_CAO_TOO_MANY_ATTEMPTS")){
      etape = "identifiants";
      clearTimeout(aideTimer); $("codeAide").hidden = true;
      $("codeFields").hidden = true; $("authFields").hidden = false;
      $("loginBtn").textContent = t("porte.connecter");
    }
  }
  $("loginBtn").disabled = false;
};

$("logoutBtn").onclick = () => {
  try {
    localStorage.removeItem("tc_token");
    localStorage.removeItem("tc_session");
    localStorage.removeItem("tc_session_exp");
  } catch {}
  location.reload();
};

$("addTarif").onclick = () => tarifRow();

$("saveBtn").onclick = async () => {
  $("saveBtn").disabled = true;
  try {
    CFG = Object.assign({}, CFG, lireFormulaire());
    await putFile("config.json", toB64(JSON.stringify(CFG, null, 2)), t("sv.message"));
    statusMsg(t("sv.enregistre"));
  } catch (e) { statusMsg(t("err.echec", { e: e.message }), "err"); }
  $("saveBtn").disabled = false;
};

$("addMatBtn").onclick = async () => {
  const file = $("newMatFile").files[0];
  const nom = $("newMatNom").value.trim();
  if (!file || !nom){ statusMsg(t("ma.manque"), "err"); return; }
  $("addMatBtn").disabled = true; $("matMsg").textContent = t("ma.traitement");
  try {
    const blob = await traiterImage(file);
    const fname = "matiere_" + nom.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".webp";
    $("matMsg").textContent = t("ma.enLigne");
    await putFile("assets/" + fname, await blobToB64(blob), "Nouvelle matière : " + nom);
    matCard({ fichier: fname, nom });
    $("newMatNom").value = ""; $("newMatFile").value = "";
    $("matMsg").textContent = "";
    statusMsg(t("ma.ajoutee"));
  } catch (e) { $("matMsg").textContent = ""; statusMsg(t("err.echec", { e: e.message }), "err"); }
  $("addMatBtn").disabled = false;
};

$("addCollBtn").onclick = async () => {
  const label = $("newCollLabel").value.trim();
  const files = [...$("newCollFiles").files];
  if (!label || !files.length){ statusMsg(t("co.manqueNom"), "err"); return; }
  const id = label.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  if (!id){ statusMsg(t("co.nomInvalide"), "err"); return; }
  // associer chaque fichier à sa lettre (1re lettre du nom de fichier)
  const parLettre = {};
  for (const f of files){
    const L = f.name[0].toUpperCase();
    if (L >= "A" && L <= "Z" && !parLettre[L]) parLettre[L] = f;
  }
  const lettres = Object.keys(parLettre).sort();
  if (!lettres.length){ statusMsg(t("co.aucunFichier"), "err"); return; }
  const manquantes = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].filter(L => !parLettre[L]);
  if (manquantes.length && !window.__collConfirm){
    window.__collConfirm = true;
    statusMsg(t("co.manquantes", { l: manquantes.join(" ") }), "err");
    return;
  }
  window.__collConfirm = false;
  $("addCollBtn").disabled = true;
  try {
    let n = 0;
    for (const L of lettres){
      $("collMsg").textContent = `Lettre ${L} — ${++n}/${lettres.length} (recadrage, filigrane, mise en ligne)…`;
      const blob = await traiterImage(parLettre[L]);
      await putFile(`assets/${id}_${L}.webp`, await blobToB64(blob), `Collection ${label} : lettre ${L}`);
    }
    collRow({ id, label });
    $("newCollLabel").value = ""; $("newCollFiles").value = "";
    $("collMsg").textContent = "";
    statusMsg(t("co.enLigne"));
  } catch (e) { $("collMsg").textContent = ""; statusMsg(t("err.echec", { e: e.message }), "err"); }
  $("addCollBtn").disabled = false;
};

/* démarrage : détection du mode + reconnexion automatique */
(async () => {
  try {
    const ctrl = new AbortController();
    const minuteur = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch(ATELIER_API + "/status", { signal: ctrl.signal });
    clearTimeout(minuteur);
    const s = await r.json();
    MODE = (r.ok && s.configure) ? "serveur" : "cle";
  } catch { MODE = "cle"; }

  if (MODE === "serveur"){
    // balise anonyme : cette ouverture de la page atelier compte dans le journal
    try { fetch(ATELIER_API + "/visite", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ page: "atelier" }), keepalive: true }).catch(() => {}); } catch {}
    $("authFields").hidden = false;
    let jeton = null, exp = null;
    try { jeton = localStorage.getItem("tc_session"); exp = localStorage.getItem("tc_session_exp"); } catch {}
    if (jeton && exp && new Date(exp) > new Date()){
      SESSION = jeton;
      try { await ouvrirDash(); return; } catch { SESSION = null; }
    }
  } else {
    $("tokenFields").hidden = false;
    let saved = null;
    try { saved = localStorage.getItem("tc_token"); } catch {}
    if (saved){
      TOKEN = saved;
      try { await ouvrirDash(); return; } catch { TOKEN = null; }
    }
  }
})();
</script>
